<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAKHAMA STORE DZ | المتجر الرسمي</title>
    <!-- خط تجوال العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        /* خلفية سوداء ملكية فاخرة وبسيطة جداً */
        body {
            background-color: #090d16;
            color: #ffffff;
            padding: 20px;
            direction: rtl;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 1. الهيدر الفخم */
        header {
            background: rgba(18, 26, 43, 0.95);
            padding: 18px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            position: sticky;
            top: 10px;
            z-index: 90;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-bottom: 3px solid #d4af37;
            gap: 15px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
        }

        .brand-icon-box {
            width: 65px;
            height: 65px;
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            flex-shrink: 0;
            padding: 3px;
            overflow: hidden;
        }

        .brand-icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 13px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 23px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #fcf6ba 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 10px;
            color: #d4af37;
            letter-spacing: 3px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .cart-btn-nav {
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            color: #000000;
            border: none;
            padding: 12px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cart-btn-nav:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        .cart-badge {
            background-color: #000000;
            color: #d4af37;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        /* 2. بوابات التنقل (أحدث المنتجات / التخفيضات) */
        .portals-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .portal-btn {
            background: rgba(18, 26, 43, 0.9);
            color: #cbd5e1;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 12px 24px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .portal-btn.active {
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            color: #000000;
            border-color: #fcf6ba;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        /* إخفاء وإظهار الأقسام بسلاسة */
        .store-view {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .store-view.active-view {
            display: block;
            opacity: 1;
        }

        /* 3. قسم عرض المنتجات والتخفيضات */
        .products-section {
            background: rgba(18, 26, 43, 0.8);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
            flex: 1;
        }

        .section-title {
            font-size: 22px;
            color: #fcf6ba;
            border-right: 5px solid #d4af37;
            padding-right: 14px;
            margin-bottom: 25px;
            font-weight: 900;
        }

        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
            width: 100%;
        }

        .card {
            background: rgba(26, 37, 60, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            width: 100%;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
            border-color: #d4af37;
        }

        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        .card h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: 700;
        }

        .price {
            font-size: 20px;
            font-weight: 900;
            color: #fcf6ba;
            margin-bottom: 14px;
        }

        .add-btn {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 900;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .add-btn:hover {
            background: #fcf6ba;
            transform: scale(1.02);
        }

        .empty-sales {
            text-align: center;
            color: #94a3b8;
            padding: 40px;
            font-size: 16px;
        }

        /* 4. فوتر الحقوق المحفوظة */
        footer {
            margin-top: 35px;
            padding: 20px;
            background: rgba(18, 26, 43, 0.95);
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            text-align: center;
        }

        .copyright-text {
            font-size: 14px;
            font-weight: 800;
            color: #d4af37;
            letter-spacing: 1px;
            direction: ltr;
            display: inline-block;
        }

        /* 5. النافذة الجانبية للسلة */
        .cart-overlay {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            z-index: 100;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            max-width: 100%;
            height: 100%;
            background: #090d16;
            box-shadow: -5px 0 35px rgba(0, 0, 0, 0.9);
            z-index: 101;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            border-left: 2px solid #d4af37;
        }

        .cart-drawer.active {
            right: 0;
        }

        .cart-header {
            padding: 20px;
            background: #121a2b;
            color: #ffffff;
            border-bottom: 2px solid #d4af37;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            color: #fcf6ba;
            font-size: 17px;
            font-weight: 800;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: #94a3b8;
        }

        .close-btn:hover {
            color: #d4af37;
        }

        .cart-body {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #121a2b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .cart-item img {
            width: 55px;
            height: 55px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 700;
            font-size: 14px;
            color: #ffffff;
        }

        .cart-item-price {
            font-size: 13px;
            color: #fcf6ba;
            font-weight: 800;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 5px;
        }

        .qty-btn {
            background: #1e2a40;
            color: #ffffff;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .qty-btn:hover {
            background: #d4af37;
            color: #000000;
        }

        .qty-value {
            font-weight: bold;
            font-size: 13px;
            color: #ffffff;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 18px;
        }

        .order-form {
            margin-top: 18px;
            padding-top: 15px;
            border-top: 2px dashed #1e2a40;
        }

        .order-form h4 {
            margin-bottom: 12px;
            color: #fcf6ba;
            font-size: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #cbd5e1;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #121a2b;
            border: 1px solid #1e2a40;
            border-radius: 8px;
            font-size: 13px;
            color: #ffffff;
            outline: none;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: #d4af37;
        }

        .cart-footer {
            padding: 20px;
            background: #121a2b;
            border-top: 1px solid #1e2a40;
        }

        .total-box {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 15px;
            color: #fcf6ba;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }

        .submit-btn:hover {
            background: #16a34a;
        }

        .submit-btn:disabled {
            background: #64748b;
            cursor: not-allowed;
        }

        .empty-msg {
            text-align: center;
            color: #64748b;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <!-- 1. الهيدر بـ اللوجو المدمج الخاص بك -->
    <header>
        <a href="#" class="brand-logo">
            <div class="brand-icon-box">
                <img src="https://i.postimg.cc/hfyKdH81/FAKHAMA.jpg" alt="FAKHAMA STORE DZ Logo">
            </div>
            <div class="brand-text">
                <span class="brand-title">FAKHAMA STORE DZ</span>
                <span class="brand-subtitle">OFFICIAL ONLINE STORE</span>
            </div>
        </a>
        <button class="cart-btn-nav" id="openCartBtn">
            🛒 السلة <span class="cart-badge" id="cartBadge">0</span>
        </button>
    </header>

    <!-- 2. أزرار التنقل بين بوابتي أحدث المنتجات والتخفيضات -->
    <div class="portals-bar">
        <button class="portal-btn active" onclick="switchView('latest', this)">✨ أحدث المنتجات</button>
        <button class="portal-btn" onclick="switchView('sales', this)">التخفيضات 🔥🔥 </button>
    </div>

    <!-- 3. بوابة أحدث المنتجات -->
    <div id="view-latest" class="store-view active-view">
        <section class="products-section">
            <h2 class="section-title">أحدث المنتجات</h2>

            <div class="products-container">


                <div class="card" data-id="2" data-title="سماعات بلوتوث ممتازة" data-price="3200" data-img="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="سماعات">
                    <h3>سماعات بلوتوث </h3>
                    <div class="price">3,000 د.ج</div>
                    <button class="add-btn">إضافة للسلة 🛒</button>
                </div>

                <div class="card" data-id="3" data-title="عطر رجالي مميز" data-price="2500" data-img="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=500">
                    <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?w=500" alt="عطر">
                    <h3>عطر رجالي chanel</h3>
                    <div class="price">2,500 د.ج</div>
                    <button class="add-btn">إضافة للسلة 🛒</button>
                </div>

            </div>
        </section>
    </div>

    <!-- 4. بوابة التخفيضات (مخصصة وجاهزة لتسجيل تخفيضاتك فيها لاحقاً) -->
    <div id="view-sales" class="store-view">
        <section class="products-section">
            <h2 class="section-title">عروض التخفيضات الكبرى 🔥</h2>

            <div class="products-container" id="salesContainer">
                <!-- يمكنك إضافة منتجات التخفيض هنا بنفس طريقة الكروت في الأعلى -->
                
            </div>
        </section>
    </div>

    <!-- 5. فوتر الحقوق المحفوظة -->
    <footer>
        <div class="copyright-text">All Rights Reserved @YOUCEF/BIE</div>
    </footer>

    <!-- 6. النافذة الجانبية للسلة -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>سلة التسوق - FAKHAMA STORE 🛒</h3>
            <button class="close-btn" id="closeCartBtn">&times;</button>
        </div>

        <div class="cart-body">
            <div id="cartItemsList">
                <p class="empty-msg">السلة فارغة حالياً</p>
            </div>

            <form id="checkoutForm" class="order-form" style="display: none;">
                <h4>معلومات التوصيل (الشحن)</h4>
                
                <div class="form-group">
                    <label>الاسم واللقب:</label>
                    <input type="text" id="custName" required placeholder="مثال: محمد بن علي">
                </div>

                <div class="form-group">
                    <label>رقم الهاتف:</label>
                    <input type="tel" id="custPhone" required placeholder="07XXX/06XXX/05XXX">
                </div>

                <div class="form-group">
                    <label>الولاية:</label>
                    <input type="text" id="custState" required placeholder="مثال: الجزائر العاصمة، وهران...">
                </div>

                <div class="form-group">
                    <label>العنوان الكامل:</label>
                    <textarea id="custAddress" rows="2" required placeholder="البلدية، اسم الشارع، رقم الدار..."></textarea>
                </div>
            </form>
        </div>

        <div class="cart-footer">
            <div class="total-box">
                <span>المجموع الكلي:</span>
                <span id="totalPriceEl">0 د.ج</span>
            </div>
            <button class="submit-btn" id="checkoutBtn" style="display: none;">تأكيد الطلب الآن 📩</button>
        </div>
    </div>

    <!-- 7. البرمجة والتحكم في البوابات والتليجرام -->
    <script>
        const TELEGRAM_BOT_TOKEN = '8926729639:AAHJNRKTxKrfKgTrMwzJhCcKAQEp19zp3Ck';
        const TELEGRAM_CHAT_ID = '8310859071';

        let cart = [];

        // دالة التبديل بين بوابة أحدث المنتجات وبوابة التخفيضات
        function switchView(viewName, btnElement) {
            document.querySelectorAll('.store-view').forEach(view => {
                view.classList.remove('active-view');
            });
            document.querySelectorAll('.portal-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(`view-${viewName}`).classList.add('active-view');
            btnElement.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        const cartDrawer = document.getElementById('cartDrawer');
        const cartOverlay = document.getElementById('cartOverlay');
        const openCartBtn = document.getElementById('openCartBtn');
        const closeCartBtn = document.getElementById('closeCartBtn');
        const cartBadge = document.getElementById('cartBadge');
        const cartItemsList = document.getElementById('cartItemsList');
        const totalPriceEl = document.getElementById('totalPriceEl');
        const checkoutForm = document.getElementById('checkoutForm');
        const checkoutBtn = document.getElementById('checkoutBtn');

        function openCart() {
            cartDrawer.classList.add('active');
            cartOverlay.style.display = 'block';
        }

        function closeCart() {
            cartDrawer.classList.remove('active');
            cartOverlay.style.display = 'none';
        }

        openCartBtn.addEventListener('click', openCart);
        closeCartBtn.addEventListener('click', closeCart);
        cartOverlay.addEventListener('click', closeCart);

        // إضافة المنتج للسلة وتحديث الرقم فقط دون فتح السلة
        document.querySelectorAll('.add-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const card = e.target.closest('.card');
                const id = card.dataset.id;
                const title = card.dataset.title;
                const price = parseInt(card.dataset.price);
                const img = card.dataset.img;

                const existingItem = cart.find(item => item.id === id);

                if (existingItem) {
                    existingItem.qty += 1;
                } else {
                    cart.push({ id, title, price, img, qty: 1 });
                }

                updateCartUI();

                btn.style.transform = 'scale(0.95)';
                setTimeout(() => btn.style.transform = 'none', 150);
            });
        });

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    removeItem(id);
                    return;
                }
            }
            updateCartUI();
        }

        function removeItem(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            cartBadge.textContent = totalQty;

            cartBadge.style.transform = 'scale(1.3)';
            setTimeout(() => cartBadge.style.transform = 'scale(1)', 200);

            if (cart.length === 0) {
                cartItemsList.innerHTML = '<p class="empty-msg">السلة فارغة حالياً</p>';
                totalPriceEl.textContent = '0 د.ج';
                checkoutForm.style.display = 'none';
                checkoutBtn.style.display = 'none';
                return;
            }

            checkoutForm.style.display = 'block';
            checkoutBtn.style.display = 'block';

            cartItemsList.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                total += item.price * item.qty;
                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <img src="${item.img}" alt="${item.title}">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.title}</div>
                        <div class="cart-item-price">${(item.price * item.qty).toLocaleString()} د.ج</div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
                            <span class="qty-value">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeItem('${item.id}')">🗑️</button>
                `;
                cartItemsList.appendChild(div);
            });

            totalPriceEl.textContent = total.toLocaleString() + ' د.ج';
        }

        checkoutBtn.addEventListener('click', async () => {
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const state = document.getElementById('custState').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            if (!name || !phone || !state || !address) {
                alert('يرجى ملء كافة معلومات التوصيل (الاسم واللقب، الهاتف، الولاية، والعنوان الكامل)');
                return;
            }

            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }

            checkoutBtn.disabled = true;
            checkoutBtn.textContent = 'جاري إرسال الطلب والصور...';

            let captionText = `👑 *طلب جديد من FAKHAMA STORE DZ!*\n\n`;
            captionText += `👤 *الاسم واللقب:* ${name}\n`;
            captionText += `📞 *رقم الهاتف:* ${phone}\n`;
            captionText += `📍 *الولاية:* ${state}\n`;
            captionText += `🏠 *العنوان الكامل:* ${address}\n\n`;
            captionText += `📦 *المنتجات المطلوبة:*\n`;

            let totalSum = 0;
            cart.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                totalSum += itemTotal;
                captionText += `${index + 1}. *${item.title}*\n   - الكمية: ${item.qty}\n   - السعر: ${itemTotal.toLocaleString()} د.ج\n`;
            });

            captionText += `\n💰 *المجموع الإجمالي:* ${totalSum.toLocaleString()} د.ج`;

            try {
                const firstProductPhoto = cart[0].img;
                const photoUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`;

                let response = await fetch(photoUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        photo: firstProductPhoto,
                        caption: captionText,
                        parse_mode: 'Markdown'
                    })
                });

                if (cart.length > 1) {
                    for (let i = 1; i < cart.length; i++) {
                        await fetch(photoUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: TELEGRAM_CHAT_ID,
                                photo: cart[i].img,
                                caption: `🖼️ *صورة المنتج الإضافي (${i + 1}):* ${cart[i].title} (الكمية: ${cart[i].qty})`,
                                parse_mode: 'Markdown'
                            })
                        });
                    }
                }

                if (response.ok) {
                    alert(`شكراً لك يا ${name}! تم إرسال طلبك وصور المنتجات بنجاح لمتجر FAKHAMA STORE DZ وسنتواصل معك قريباً.`);
                    cart = [];
                    document.getElementById('checkoutForm').reset();
                    updateCartUI();
                    closeCart();
                } else {
                    alert('حدث خطأ أثناء إرسال الطلب، يرجى المحاولة لاحقاً.');
                }
            } catch (error) {
                console.error(error);
                alert('حدث خطأ أثناء الاتصال بالسيرفر، تأكد من اتصالك بالإنترنت.');
            } finally {
                checkoutBtn.disabled = false;
                checkoutBtn.textContent = 'تأكيد الطلب الآن 📩';
            }
        });
    </script>

</body>
</html>
